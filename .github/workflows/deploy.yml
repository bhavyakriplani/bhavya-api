
name: Build and deploy SayHello API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment that is already running.
concurrency:
  group: sayhello-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy to Ubuntu VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate application and deployment script
        run: |
          set -eu

          test -s server.js
          test -s package.json
          test -s install-remote.sh

          node --check server.js
          node -e "const p=require('./package.json'); if (!p.scripts || !p.scripts.start) { console.error('Missing start script in package.json'); process.exit(1); }"

          bash -n install-remote.sh

      - name: Prepare deployment bundle
        run: |
          set -eu
          tar -czf deploy-bundle.tar.gz server.js package.json
          test -s deploy-bundle.tar.gz

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          set -eu

          test -n "$VM_SSH_KEY" || {
            echo "VM_SSH_KEY secret is missing."
            exit 1
          }

          test -n "$VM_KNOWN_HOSTS" || {
            echo "VM_KNOWN_HOSTS secret is missing."
            exit 1
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Validate SSH configuration
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -eu

          test -n "$VM_HOST" || {
            echo "VM_HOST secret is missing."
            exit 1
          }

          test -n "$VM_USER" || {
            echo "VM_USER secret is missing."
            exit 1
          }

          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null

      - name: Transfer release files to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -eu

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            deploy-bundle.tar.gz \
            "$VM_USER@$VM_HOST:/tmp/sayhello-${RELEASE_ID}.tar.gz"

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            install-remote.sh \
            "$VM_USER@$VM_HOST:/tmp/sayhello-install-${RELEASE_ID}.sh"

      - name: Install release with health-checked traffic switch
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -eu

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "sudo bash /tmp/sayhello-install-${RELEASE_ID}.sh /tmp/sayhello-${RELEASE_ID}.tar.gz ${RELEASE_ID}"

      - name: Remove temporary SSH key
        if: always()
        run: |
          rm -f "$HOME/.ssh/deploy_key"
